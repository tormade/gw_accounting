[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "getraenkeladen-tool"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.10,<6.11",
  "SQLAlchemy>=2.0,<3",
  "openpyxl>=3.1,<4",
  "pydantic>=2.8,<3",
  "reportlab>=4.2,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pyinstaller>=6.10,<7",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
